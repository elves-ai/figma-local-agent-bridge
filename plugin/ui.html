<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Figma Local Agent Bridge</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 10px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
      }
      .status {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 8px;
        min-width: 0;
        white-space: nowrap;
      }
      .dot {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--figma-color-icon-tertiary);
      }
      .dot.connecting {
        background: #f3c11b;
        box-shadow: 0 0 0 3px rgba(243, 193, 27, .15);
      }
      .dot.connected {
        background: #14ae5c;
        box-shadow: 0 0 0 3px rgba(20, 174, 92, .15);
      }
      button {
        width: 58px;
        height: 32px;
        border: 0;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: .45; cursor: default; }
      .primary { color: white; background: var(--figma-color-bg-brand); }
      .secondary {
        color: var(--figma-color-text);
        background: var(--figma-color-bg-tertiary);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="status">
        <span id="dot" class="dot"></span>
        <strong id="status">未连接</strong>
      </div>
      <button id="connect" class="primary">连接</button>
      <button id="disconnect" class="secondary">断开</button>
    </div>

    <script>
      const BRIDGE_URL = "http://localhost:3846";
      const elements = {
        connect: document.getElementById("connect"),
        disconnect: document.getElementById("disconnect"),
        status: document.getElementById("status"),
        dot: document.getElementById("dot"),
      };

      const clientId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      let connectionState = "disconnected";
      let polling = false;
      let connectionGeneration = 0;
      let context = { fileName: "", pageName: "", selection: [] };

      function setConnectionState(value, label) {
        connectionState = value;
        elements.status.textContent = label || {
          disconnected: "未连接",
          connecting: "连接中",
          connected: "已连接",
        }[value];
        elements.dot.classList.toggle("connecting", value === "connecting");
        elements.dot.classList.toggle("connected", value === "connected");
        elements.connect.disabled = value !== "disconnected";
        elements.disconnect.disabled = value === "disconnected";
      }

      function endpoint(path) {
        return BRIDGE_URL + path;
      }

      async function heartbeat() {
        const response = await fetch(endpoint("/v1/plugin/heartbeat"), {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ ...context, clientId }),
        });
        if (!response.ok) throw new Error(`Heartbeat HTTP ${response.status}`);
      }

      async function notifyDisconnect() {
        try {
          await fetch(endpoint("/v1/plugin/disconnect"), {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ clientId }),
          });
        } catch (_error) {
          // The service may already be offline.
        }
      }

      async function poll() {
        if (connectionState !== "connected" || polling) return;
        polling = true;
        try {
          await heartbeat();
          const response = await fetch(endpoint("/v1/commands/next"));
          if (response.status === 200) {
            const command = await response.json();
            parent.postMessage(
              { pluginMessage: { type: "bridge-command", command } },
              "*",
            );
          } else if (response.status !== 204) {
            throw new Error(`Poll HTTP ${response.status}`);
          }
        } catch (_error) {
          connectionGeneration += 1;
          setConnectionState("disconnected", "连接断开");
        } finally {
          polling = false;
        }
      }

      async function connect() {
        if (connectionState !== "disconnected") return;
        const generation = ++connectionGeneration;
        setConnectionState("connecting");
        try {
          await heartbeat();
          if (generation !== connectionGeneration) return;
          setConnectionState("connected");
        } catch (_error) {
          if (generation !== connectionGeneration) return;
          setConnectionState("disconnected", "连接失败");
        }
      }

      async function submitResult(message) {
        try {
          const response = await fetch(
            endpoint(`/v1/commands/${encodeURIComponent(message.commandId)}/result`),
            {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                ok: message.ok,
                data: message.data,
                error: message.error,
              }),
            },
          );
          if (!response.ok) throw new Error(`Result HTTP ${response.status}`);
        } catch (_error) {
          connectionGeneration += 1;
          setConnectionState("disconnected", "连接断开");
        }
      }

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "figma-context") {
          context = message;
        } else if (message.type === "bridge-result") {
          submitResult(message);
        }
      };

      elements.connect.onclick = connect;
      elements.disconnect.onclick = async () => {
        if (connectionState === "disconnected") return;
        connectionGeneration += 1;
        setConnectionState("disconnected");
        await notifyDisconnect();
      };

      setConnectionState("disconnected");
      setInterval(poll, 650);
    </script>
  </body>
</html>
